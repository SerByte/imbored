name: Кроны — часовой триггер

# Расписание в vercel.json стоит суточное не по замыслу: на Hobby крон
# вызывается примерно раз в сутки независимо от выражения (это же записано в
# app/api/cron/news/route.ts и DEPLOY.md). Пропускную способность приходилось
# добирать цепочкой из 24 звеньев подряд — то есть вся суточная работа шла
# одним двадцатиминутным залпом в 04:00 UTC, и до следующего залпа лента не
# менялась вообще. Отсюда и «Что нового» с недельным верхом.
#
# Дешевле всего чинится снаружи: расписание живёт здесь, а Vercel-крон
# остаётся бесплатной подстраховкой на случай, если GitHub пропустит прогон.
# Пересказы в vercel.json не попадают вовсе: на Hobby лимит — два расписания на
# проект, и они уже заняты новостями и карточками.
#
# Частить бессмысленно и почти бесплатно одновременно: слайс сам обрывает
# цепочку, когда очередь разобрана (hasMore = false), поэтому частый запуск
# просто делает меньше работы за раз. Ограничитель — спрос очереди (~300
# опросов в сутки на замере), а не число триггеров.
#
# ОДИН воркфлоу на оба крона, а не два. Приватный репозиторий тарифицируется
# поминутно с округлением ВВЕРХ, то есть каждый прогон стоит минимум минуту
# независимо от того, что он делает два curl'а вместо одного. Двумя
# воркфлоу это было 24 × 2 × 30 = 1440 минут в месяц из бесплатных 2000 —
# до всякого CI. Одним стало 720.
#
# Разводить их по времени было не нужно и раньше: /api/cron/digest ходит только
# к Claude и держит свою аренду (DIGEST_LEASE), а не общий со Steam замок.
# Смещение на :47 у прежнего воркфлоу было лишь про забитые слоты GitHub.
on:
  schedule:
    # НЕ :00 — самый забитый слот у GitHub, прогоны в нём задерживаются сильнее
    - cron: '17 * * * *'
  # Ручной запуск: и чтобы дёрнуть очередь руками, и чтобы расписание не
  # отключилось само — GitHub глушит schedule после 60 дней без активности.
  workflow_dispatch:

# Прогон поверх прогона не нужен: если предыдущий задержался, второй всё равно
# упрётся в аренду на стороне приложения и вернёт skipped.
concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Job обязан быть коротким: только curl, без checkout и без setup-node.
    timeout-minutes: 3
    steps:
      - name: Пнуть /api/cron/news
        run: |
          code=$(curl -sS -m 30 -o /tmp/news.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://imbored.cc/api/cron/news)
          echo "HTTP $code"
          cat /tmp/news.txt
          # 202 — взял работу, 202 со skipped:locked — цепочка ещё идёт, это норма.
          # Валим прогон только на 401/5xx: молчащий крон уже один раз стоил
          # ленте недели, и узнать об этом хочется из почты, а не с сайта.
          test "$code" = "202" || test "$code" = "200"

      # always(): упавшие новости не должны заодно глушить пересказы. Это две
      # независимые очереди с разными арендами, и объединение в один воркфлоу
      # ради минут не должно связывать их судьбы.
      - name: Пнуть /api/cron/digest
        if: always()
        run: |
          code=$(curl -sS -m 30 -o /tmp/digest.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://imbored.cc/api/cron/digest)
          echo "HTTP $code"
          cat /tmp/digest.txt
          test "$code" = "202" || test "$code" = "200"
