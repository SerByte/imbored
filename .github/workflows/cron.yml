name: Кроны — часовой триггер

# Расписание в vercel.json стоит суточное не по замыслу: на Hobby крон
# вызывается примерно раз в сутки независимо от выражения (это же записано в
# app/api/cron/news/route.ts и DEPLOY.md). Пропускную способность приходилось
# добирать цепочкой из 24 звеньев подряд — то есть вся суточная работа шла
# одним двадцатиминутным залпом в 04:00 UTC, и до следующего залпа лента не
# менялась вообще. Отсюда и «Что нового» с недельным верхом.
#
# Дешевле всего чинится снаружи: расписание живёт здесь, а Vercel-крон
# остаётся бесплатной подстраховкой на случай, если GitHub пропустит прогон.
# Пересказы в vercel.json не попадают вовсе: на Hobby лимит — два расписания на
# проект, и они уже заняты новостями и карточками.
#
# Частить бессмысленно и почти бесплатно одновременно: запуск сам кончается,
# когда очередь разобрана (hasMore = false), поэтому частый запуск просто
# делает меньше работы за раз. Ограничитель — спрос очереди (~300 опросов в
# сутки на замере), а не число триггеров.
#
# /api/cron/pages здесь НЕ пингуется, и это не забыто. Аренда Steam у
# карточек одна с новостями, а пинг секундой позже новостей почти всегда
# упирался бы в неё (skipped: locked). Карточки зовёт конец запуска новостей —
# ровно когда аренда отдана, — пока не выбран их суточный потолок звеньев
# (pagesNeedKick и pagesDailyLinks в lib/cron.ts).
#
# ОДИН воркфлоу на оба крона, а не два. Приватный репозиторий тарифицируется
# поминутно с округлением ВВЕРХ, то есть каждый прогон стоит минимум минуту
# независимо от того, что он делает два curl'а вместо одного. Двумя
# воркфлоу это было 24 × 2 × 30 = 1440 минут в месяц из бесплатных 2000 —
# до всякого CI. Одним стало 720.
#
# Разводить их по времени было не нужно и раньше: /api/cron/digest ходит только
# к Claude и держит свою аренду (DIGEST_LEASE), а не общий со Steam замок.
# Смещение на :47 у прежнего воркфлоу было лишь про забитые слоты GitHub.
on:
  schedule:
    # НЕ :00 — самый забитый слот у GitHub, прогоны в нём задерживаются сильнее
    - cron: '17 * * * *'
    # Сторож прокси Cloudflare (job cloudflare ниже) — раз в сутки, 08:47 по
    # Москве, чтобы письмо ждало к утру. Обе строки расписания job'ы сверяют в
    # своих if буквально: поменял здесь — поменяй и там (сверяет
    # lib/prodinfra.test.ts).
    - cron: '47 5 * * *'
  # Ручной запуск: и чтобы дёрнуть очередь руками, и чтобы расписание не
  # отключилось само — GitHub глушит schedule после 60 дней без активности.
  workflow_dispatch:

# Прогон поверх прогона не нужен: если предыдущий задержался, второй всё равно
# упрётся в аренду на стороне приложения и вернёт skipped.
concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  ping:
    # Суточный прогон — только для сторожа: пинок сверх часовых очереди ничего
    # не даёт, а минуту стоит. Ручной запуск пинает, как и раньше.
    if: github.event.schedule != '47 5 * * *'
    runs-on: ubuntu-latest
    # Job обязан быть коротким: только curl, без checkout и без setup-node.
    timeout-minutes: 3
    steps:
      # Коды пингов ниже — это 202 ДО after(), то есть до всякой работы:
      # упавший срез, снятый по сроку запуск и крон карточек, который вообще не
      # пришёл, за ними не видны. /api/cron/health читает отметки, которые
      # кроны пишут о себе, и отвечает 503, если что-то протухло, упало или
      # снято по сроку: прогон краснеет, и приходит письмо.
      #
      # ПЕРВЫМ, до пингов, и это не косметика. Health должен читать ИТОГИ
      # прошлого часа, а к :17 они дописаны: запуск длится не дольше 300 с,
      # карточки, которых пинает конец новостей, кончают минут через десять.
      # После пингов он читал бы уже нынешние запуски, начатые секунды назад, —
      # как минимум их первое звено, если оно успело отработать, — и крон,
      # падающий через раз, проскальзывал бы зелёным. Стартовая отметка
      # тревогу прошлого итога и так не затирает (lib/chain), но это страховка
      # для триггеров не отсюда: суточных из vercel.json, пинков, ручного curl.
      # Отдельной задержки не ждём: минута сна удвоила бы счёт за минуты, ради
      # которого воркфлоу и один.
      - name: Здоровье кронов
        run: |
          code=$(curl -sS -m 30 -o /tmp/health.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://imbored.cc/api/cron/health)
          echo "HTTP $code"
          cat /tmp/health.txt
          test "$code" = "200"

      # always(): красный health — повод для письма, а не для того, чтобы
      # очереди встали. Пинки идут при любом его ответе.
      - name: Пнуть /api/cron/news
        if: always()
        run: |
          code=$(curl -sS -m 30 -o /tmp/news.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://imbored.cc/api/cron/news)
          echo "HTTP $code"
          cat /tmp/news.txt
          # 202 — взял работу, 202 со skipped — аренду держит другой запуск, это норма.
          # Валим прогон только на 401/5xx: молчащий крон уже один раз стоил
          # ленте недели, и узнать об этом хочется из почты, а не с сайта.
          test "$code" = "202" || test "$code" = "200"

      # always(): упавшие новости не должны заодно глушить пересказы. Это две
      # независимые очереди с разными арендами, и объединение в один воркфлоу
      # ради минут не должно связывать их судьбы.
      - name: Пнуть /api/cron/digest
        if: always()
        run: |
          code=$(curl -sS -m 30 -o /tmp/digest.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://imbored.cc/api/cron/digest)
          echo "HTTP $code"
          cat /tmp/digest.txt
          test "$code" = "202" || test "$code" = "200"

  # Облачко у A @ и CNAME www в Cloudflare обязано быть серым (DNS only), и
  # однажды прод уже разошёлся с DEPLOY.md молча — заметил это только аудит.
  # Прокси включается одним кликом в дашборде, а снаружи сайт выглядит живым:
  # только не из России, где за Cloudflare он приходит обрезанным, и не для
  # лимитов по IP, которые перестают видеть посетителей. Почему прокси нельзя —
  # DEPLOY.md, §5.
  #
  # Отдельный job, а не шаг в ping: пока облачко оранжевое, шаг красил бы
  # каждый часовой прогон, и настоящий сбой кронов тонул бы в этом шуме.
  # Раз в сутки, а не каждый час: job — это минимум минута сверху, и часовой
  # сторож вернул бы те 720 минут в месяц, от которых этот файл уже уходил, —
  # ради настройки, которая меняется только руками. Ручной запуск гоняет и
  # его: переключил облачко — запусти воркфлоу и убедись, что job зелёный.
  cloudflare:
    if: github.event.schedule != '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Прокси Cloudflare выключен
        run: |
          # За прокси Cloudflare подписывает ответ своим server и ставит
          # cf-ray и cf-cache-status; Vercel напрямую не шлёт ничего из этого.
          # Обе записи: облачко у каждой своё, и оранжевый www при сером apex
          # снаружи не заметен. Без -L — у www свой первый ответ (редирект на
          # apex), он и выдаёт, кто стоит перед этой записью.
          # Упавший curl тоже красный: не проверили — не значит, что прокси нет.
          proxied=
          for host in imbored.cc www.imbored.cc; do
            headers=$(curl -sSI -m 30 "https://$host")
            echo "$headers"
            if found=$(printf '%s\n' "$headers" | grep -iE '^(server: *cloudflare|cf-ray:|cf-cache-status:)'); then
              echo "::error::$host за прокси Cloudflare ($(printf '%s' "$found" | tr -d '\r' | tr '\n' ' ')). Переведи A @ и CNAME www в DNS only (серое облако) — почему, см. DEPLOY.md, §5"
              proxied=1
            fi
          done
          test -z "$proxied"
