name: CI

# 456 тестов, строгий tsc и линтер существовали в проекте с самого начала —
# и не запускались никем и никогда. Ошибки линтера при этом спокойно жили в
# main. Этот файл ровно про то, чтобы такое больше не доезжало до продакшена.
on:
  push:
    branches: [main]
  pull_request:

# Пуш поверх пуша отменяет предыдущий прогон: гонять CI на устаревшем коммите
# незачем, а очередь на бесплатных раннерах не бесконечная.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия Node — из engines.node в package.json, как и у Vercel: тот же
      # Node, на котором бежит прод, и одно место, где её менять. Раньше здесь
      # стояла своя 22, а @types/node был от 26-го — tsc пропустил бы API,
      # которого на проде нет.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # next стоял на 16.3.0 с двумя критическими advisory (RCE на
      # Windows-сервере и RCE в оптимизаторе картинок), хотя патч без мажора
      # лежал в npm. Версия закреплена точно, так что сама она не обновится
      # никогда, — пусть следующее advisory уровня high валит CI. Только
      # продовые зависимости: дыра в vitest на проде не исполняется.
      - name: Аудит зависимостей
        run: npm audit --omit=dev --audit-level=high

      # Порядок от быстрого к медленному: типы падают за секунды и делают это
      # чаще всего, сборка — последняя.
      # typegen обязателен и обязан идти ПЕРЕД tsc.
      #
      # PageProps и LayoutProps — глобальные типы, которые Next генерирует в
      # .next/types/routes.d.ts, а tsconfig подключает через include. Локально
      # их постоянно переписывает работающий next dev, поэтому там всё зелено
      # всегда; на чистом клоне в CI каталога .next нет и создавать его некому,
      # и tsc валился с «Cannot find name 'LayoutProps'» на шести файлах,
      # которых никто не трогал. Заодно typegen создаёт next-env.d.ts, который
      # намеренно не в репозитории.
      - name: Типы
        run: npx next typegen && npx tsc --noEmit

      # next lint в Next 16 удалён (docs/05-config/03-eslint.md), поэтому
      # зовём eslint напрямую. Предупреждения не валят прогон — в проекте
      # намеренно живёт одно (зависимости эффекта в PixelSnow: включить их
      # значит перезапускать WebGL-сцену на каждый проп). Ошибки валят.
      - name: Линтер
        run: npx eslint

      - name: Тесты
        run: npm test

      # Сборка ловит то, что не ловят ни типы, ни тесты: пререндер роутов.
      # Секретов здесь нет намеренно — приложение обязано собираться без базы,
      # иначе форк или превью-окружение не соберётся вовсе.
      - name: Сборка
        run: npm run build
