name: Пересказы — часовой триггер

# Отдельно от новостей, потому что это отдельная работа с отдельным узким
# местом. Раньше опрос и пересказ делили один пятидесятисекундный бюджет среза
# в отношении 65/35, и опрос всегда выигрывал: он приносил под сотню новых
# записей, а пересказ успевал десяток. Очередь не сокращалась, а росла — замер
# на живой базе показал 1 499 → 1 644 за час.
#
# В vercel.json этот крон намеренно НЕ добавлен: на Hobby лимит — два
# расписания на проект, и они уже заняты новостями и карточками.
#
# Со Steam этот триггер не конфликтует: /api/cron/digest ходит только к Claude
# и держит свою аренду (DIGEST_LEASE), а не общий со Steam замок. Поэтому
# смещение на :47 — не про развод по времени, а просто чтобы не толпиться в
# самых забитых слотах GitHub.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: digest-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Пнуть /api/cron/digest
        run: |
          code=$(curl -sS -m 30 -o /tmp/out.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://imbored.cc/api/cron/digest)
          echo "HTTP $code"
          cat /tmp/out.txt
          # 202 — взял работу, 202 со skipped:locked — цепочка ещё идёт, норма.
          # Валим прогон на 401/5xx: молчащий крон должен быть виден в почте.
          test "$code" = "202" || test "$code" = "200"
